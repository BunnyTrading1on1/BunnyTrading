r-spacing="3">BEFORE THE SESSION</text><rect x="1446" y="414" width="210" height="38" rx="19" ry="19" fill="#F4EDE6" stroke="#EFE7DE" stroke-width="2"/><text x="1424" y="440" font-family="BunnyBody XBold" font-size="19" fill="#8A7F76" text-anchor="end" letter-spacing="3">DATE</text><rect x="104" y="480" width="1552" height="62" rx="20" ry="20" fill="#F4EDE6" opacity="0.75"/><rect x="126" y="490.0" width="42" height="42" rx="14" ry="14" fill="#FFFFFF" stroke="#C0504D" stroke-width="3"/><text x="194" y="524" font-family="BunnyBody Semi" font-size="31" fill="#1E1A17">Did I eat and sleep well?</text><rect x="104" y="550" width="1552" height="62" rx="20" ry="20" fill="#F4EDE6" opacity="0.75"/><rect x="126" y="560.0" width="42" height="42" rx="14" ry="14" fill="#FFFFFF" stroke="#C0504D" stroke-width="3"/><text x="194" y="594" font-family="BunnyBody Semi" font-size="31" fill="#1E1A17">Am I in a good mood?</text><rect x="104" y="620" width="1552" height="62" rx="20" ry="20" fill="#F4EDE6" opacity="0.75"/><rect x="126" y="630.0" width="42" height="42" rx="14" ry="14" fill="#FFFFFF" stroke="#C0504D" stroke-width="3"/><text x="194" y="664" font-family="BunnyBody Semi" font-size="31" fill="#1E1A17">Do I have a setup that looks good this morning, based on my strategy?</text><rect x="104" y="690" width="1552" height="62" rx="20" ry="20" fill="#F4EDE6" opacity="0.75"/><rect x="126" y="700.0" width="42" height="42" rx="14" ry="14" fill="#FFFFFF" stroke="#C0504D" stroke-width="3"/><text x="194" y="734" font-family="BunnyBody Semi" font-size="31" fill="#1E1A17">What condition is the overall market in for my strategy?</text><rect x="104" y="760" width="1552" height="62" rx="20" ry="20" fill="#F4EDE6" opacity="0.75"/><rect x="126" y="770.0" width="42" height="42" rx="14" ry="14" fill="#FFFFFF" stroke="#C0504D" stroke-width="3"/><text x="194" y="804" font-family="BunnyBody Semi" font-size="31" fill="#1E1A17">Is my A-quality setup printed out and pinned next to my screen?</text><rect x="104" y="830" width="1552" height="92" rx="20" ry="20" fill="#F4EDE6" opacity="0.75"/><rect x="126" y="844" width="42" height="42" rx="14" ry="14" fill="#FFFFFF" stroke="#C0504D" stroke-width="3"/><text x="194" y="870" font-family="BunnyBody Semi" font-size="31" fill="#1E1A17">Are my metrics and track record from demo trading in front of me?</text><text x="194" y="906" font-family="BunnyBody Semi" font-size="25" fill="#8A7F76">This is my motivation to stay focused when the market challenges me.</text><rect x="104" y="930" width="1552" height="62" rx="20" ry="20" fill="#F4EDE6" opacity="0.75"/><rect x="126" y="940.0" width="42" height="42" rx="14" ry="14" fill="#FFFFFF" stroke="#C0504D" stroke-width="3"/><text x="194" y="974" font-family="BunnyBody Semi" font-size="31" fill="#1E1A17">Am I willing to take zero trades today if nothing looks good?</text><rect x="104" y="1000" width="1552" height="92" rx="20" ry="20" fill="#F4EDE6" opacity="0.75"/><rect x="126" y="1014" width="42" height="42" rx="14" ry="14" fill="#FFFFFF" stroke="#C0504D" stroke-width="3"/><text x="194" y="1040" font-family="BunnyBody Semi" font-size="31" fill="#1E1A17">Have I capped how many trades I take today?</text><text x="194" y="1076" font-family="BunnyBody Semi" font-size="25" fill="#8A7F76">Max trades today:</text><rect x="446" y="1052" width="150" height="34" rx="17" ry="17" fill="#FFFFFF" stroke="#EFE7DE" stroke-width="2"/><rect x="64" y="1180" width="1632" height="132" rx="30" ry="30" fill="#FFFFFF" stroke="#EFE7DE" stroke-width="2"/><rect x="64" y="1202" width="10" height="88" rx="5" ry="5" fill="#C0504D"/><defs><linearGradient id="bglight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C0504D"/><stop offset="1" stop-color="#96322F"/></linearGradient></defs><rect x="108" y="1206" width="80" height="80" rx="25.6" ry="25.6" fill="url(#bglight)"/><g transform="translate(148.0,1254.0) scale(0.7619047619047619)" opacity="1.0"><rect x="-15" y="-46" width="11" height="38" rx="5.5" fill="#FFFFFF" transform="rotate(-12 -9.5 -27)"/><rect x="4" y="-46" width="11" height="38" rx="5.5" fill="#FFFFFF" transform="rotate(12 9.5 -27)"/><ellipse cx="0" cy="3" rx="20" ry="17.5" fill="#FFFFFF"/></g><rect x="-1.98" y="-12.19" width="3.96" height="12.95" rx="1.98" fill="url(#bglight)" transform="translate(140.76,1233.43) rotate(-12)"/><rect x="-1.98" y="-12.19" width="3.96" height="12.95" rx="1.98" fill="url(#bglight)" transform="translate(155.24,1233.43) rotate(12)"/><text x="220" y="1240" font-family="BunnyDisp Semi" font-size="33" fill="#1E1A17">Trading is a marathon, not a sprint.</text><text x="220" y="1284" font-family="BunnyBody Semi" font-size="29" fill="#8A7F76">One clean trade a day, risk managed, losses cut fast — that is how the account grows.</text></svg>